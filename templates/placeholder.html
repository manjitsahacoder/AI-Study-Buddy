<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} - AI Study Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% include 'components/pwa_head.html' %}
</head>

<body class="{{ theme_class }}">

<main class="learn-container auth-container">
    <div class="auth-header-row">
        <div>
            <span class="eyebrow">Account</span>
            <h1>{{ page_title }}</h1>
        </div>
        <div class="auth-page-actions">
            <a class="button-link secondary-link" href="{{ url_for('home') }}">Back to Home</a>
            {% include 'components/auth_nav.html' %}
        </div>
    </div>

    {% include 'components/flash_messages.html' %}

    <section class="profile-card">
        <h2>{{ heading }}</h2>
        <p>{{ message }}</p>
    </section>

    {% include 'components/footer.html' %}
</main>

</body>
</html>
