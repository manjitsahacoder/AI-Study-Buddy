<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png', v='ai-study-buddy-v2') }}">
<link rel="apple-touch-icon" type="image/png" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png', v='ai-study-buddy-v2') }}">
<script>
(function() {
    var preference = {{ theme_preference|default('light')|tojson }};
    var mediaQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

    function shouldUseDarkTheme() {
        return preference === "dark" || (preference === "system" && mediaQuery && mediaQuery.matches);
    }

    function applyTheme() {
        var useDarkTheme = shouldUseDarkTheme();
        document.documentElement.classList.toggle("dark-mode", useDarkTheme);
        document.documentElement.dataset.themePreference = preference;
        if (document.body) {
            document.body.classList.toggle("dark-mode", useDarkTheme);
        }
    }

    applyTheme();
    document.addEventListener("DOMContentLoaded", applyTheme);

    if (mediaQuery && preference === "system") {
        if (typeof mediaQuery.addEventListener === "function") {
            mediaQuery.addEventListener("change", applyTheme);
        } else if (typeof mediaQuery.addListener === "function") {
            mediaQuery.addListener(applyTheme);
        }
    }
})();
</script>
