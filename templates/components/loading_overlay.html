<div
    id="page-transition-overlay"
    class="page-transition-overlay"
    data-page-transition-overlay
    role="status"
    aria-live="polite"
    aria-atomic="true"
    hidden>
    <div class="page-transition-card">
        <div class="page-transition-brand" aria-label="AI Study Buddy">
            <img
                class="page-transition-logo"
                src="{{ url_for('static', filename='images/ai-study-buddy-logo.png') }}"
                alt=""
                aria-hidden="true">
            <div>
                <strong>AI Study Buddy</strong>
            </div>
        </div>
        <div class="page-transition-spinner" aria-hidden="true"></div>
        <p id="page-transition-message" data-page-transition-message>Loading...</p>
        <ol class="generation-stepper" data-generation-stepper aria-label="Lesson generation progress">
            <li data-generation-step="0">
                <span>Step 1</span>
                <strong>Understanding your topic</strong>
            </li>
            <li data-generation-step="1">
                <span>Step 2</span>
                <strong>Preparing lesson</strong>
            </li>
            <li data-generation-step="2">
                <span>Step 3</span>
                <strong>Creating notes</strong>
            </li>
            <li data-generation-step="3">
                <span>Step 4</span>
                <strong>Building quiz</strong>
            </li>
            <li data-generation-step="4">
                <span>Step 5</span>
                <strong>Preparing flashcards</strong>
            </li>
            <li data-generation-step="5">
                <span>Step 6</span>
                <strong>Finalizing lesson</strong>
            </li>
        </ol>
    </div>
</div>
